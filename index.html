<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#F8F7FC;
  color:#2D2A32;
}

/* NAVBAR */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:25px 10%;
  position:fixed;
  width:100%;
  top:0;
  background:rgba(248,247,252,0.9);
  backdrop-filter:blur(10px);
  z-index:1000;
  border-bottom:1px solid rgba(124,77,255,0.1);
}

.logo{
  font-size:1.7rem;
  font-weight:700;
  color:#7C4DFF;
  letter-spacing:1px;
}

nav a{
  text-decoration:none;
  color:#2D2A32;
  margin-left:30px;
  font-weight:500;
  transition:0.3s;
}

nav a:hover{
  color:#7C4DFF;
}

/* HERO */

.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 10%;
  background:
  linear-gradient(rgba(124,77,255,0.45), rgba(142,227,193,0.35)),
  url('https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=1400&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  color:white;
}

.hero-content h1{
  font-size:4.5rem;
  margin-bottom:20px;
  font-weight:700;
}

.hero-content p{
  font-size:1.2rem;
  margin-bottom:35px;
  opacity:0.95;
}

/* BOTONES */

.btn{
  padding:15px 32px;
  border:none;
  border-radius:50px;
  background:#7C4DFF;
  color:white;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  transition:0.3s;
  box-shadow:0 10px 25px rgba(124,77,255,0.25);
}

.btn:hover{
  transform:translateY(-3px);
  background:#6A3DF0;
}

/* SECCIONES */

section{
  padding:110px 10%;
}

.section-title{
  text-align:center;
  margin-bottom:60px;
}

.section-title h2{
  font-size:2.8rem;
  color:#7C4DFF;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:35px;
}

.card{
  background:white;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,0.06);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-content{
  padding:28px;
}

.card-content h3{
  margin-bottom:12px;
  color:#7C4DFF;
}

/* REQUISITOS */

.requisitos{
  background:linear-gradient(135deg,#7C4DFF,#8EE3C1);
  color:white;
  border-radius:35px;
  padding:55px;
  margin-top:70px;
  box-shadow:0 15px 40px rgba(124,77,255,0.2);
}

.requisitos h3{
  font-size:2rem;
}

.requisitos ul{
  margin-top:25px;
  padding-left:20px;
  line-height:2.2;
}

/* HISTORIAS */

.historias{
  background:#F2EEFF;
}

.testimonio{
  background:white;
  padding:35px;
  border-radius:25px;
  box-shadow:0 5px 25px rgba(0,0,0,0.05);
  transition:0.3s;
}

.testimonio:hover{
  transform:translateY(-8px);
}

.testimonio h3{
  color:#7C4DFF;
  margin-bottom:15px;
}

/* DONAR */

.donar{
  text-align:center;
}

.donar p{
  max-width:700px;
  margin:20px auto 35px;
  line-height:1.9;
}

/* CONTACTO */

.contacto-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  margin-top:40px;
}

form{
  display:flex;
  flex-direction:column;
  gap:20px;
}

input,
textarea{
  padding:16px;
  border-radius:18px;
  border:none;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.04);
  font-size:1rem;
}

textarea{
  height:150px;
  resize:none;
}

input:focus,
textarea:focus{
  outline:none;
  border:2px solid #8EE3C1;
}

/* FOOTER */

footer{
  background:#2D2A32;
  color:white;
  text-align:center;
  padding:35px;
  margin-top:40px;
}

/* RESPONSIVE */

@media(max-width:768px){

  .hero-content h1{
    font-size:2.8rem;
  }

  .hero-content p{
    font-size:1rem;
  }

  .contacto-container{
    grid-template-columns:1fr;
  }

  nav{
    display:none;
  }

  .section-title h2{
    font-size:2.2rem;
  }

}

</style>
